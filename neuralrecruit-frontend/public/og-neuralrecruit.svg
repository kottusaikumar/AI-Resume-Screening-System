<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061009"/>
      <stop offset="0.6" stop-color="#050706"/>
      <stop offset="1" stop-color="#0a1b0d"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fff68"/>
      <stop offset="1" stop-color="#35e52d"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1000" cy="120" r="210" fill="#38ff45" fill-opacity=".09" filter="url(#glow)"/>
  <circle cx="80" cy="580" r="180" fill="#3f7cff" fill-opacity=".07" filter="url(#glow)"/>
  <g transform="translate(72 66)">
