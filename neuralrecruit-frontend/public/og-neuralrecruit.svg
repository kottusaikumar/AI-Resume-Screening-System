    <path d="M27 8v7M46 27h-7M27 46v-7M8 27h7" stroke="#061006" stroke-width="3" stroke-linecap="round"/>
    <text x="72" y="23" fill="#f6f8f5" font-family="Arial, sans-serif" font-size="25" font-weight="700">NeuralRecruit</text>
    <text x="72" y="46" fill="#7d8b80" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">EVIDENCE-LED HIRING INTELLIGENCE</text>
  </g>
