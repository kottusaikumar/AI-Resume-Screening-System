    <text x="0" y="82" fill="#57ff47" font-family="Arial, sans-serif" font-size="66" font-weight="700">Decide with evidence.</text>
    <text x="0" y="147" fill="#a4afa6" font-family="Arial, sans-serif" font-size="24">Explainable resume intelligence and job-matching</text>
    <text x="0" y="181" fill="#a4afa6" font-family="Arial, sans-serif" font-size="24">decision support for technical hiring.</text>
  </g>
